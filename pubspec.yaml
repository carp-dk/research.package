name: research_package
description: A Flutter framework for obtaining informed consent, showing surveys and collecting results.
version: 3.1.0
homepage: https://github.com/cph-cachet/research.package

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  carp_themes_package: ^0.2.0
  carp_serializable: ^3.0.0

  signature: ^6.3.0
  rxdart: ">=0.27.0 <1.0.0"
  json_annotation: ^4.12.0
  audioplayers: ^6.7.0
  video_player: ^2.11.1
  plugin_platform_interface: ^2.0.2
  permission_handler: '>=12.0.0 <13.0.0'  # For requesting OS permissions during informed consent
  health: '>=13.0.0 <14.0.0'  # Health data is not covered by permission_handler - see RPPermissionType.health
  intl: '>=0.19.0 <0.21.0'  # For the CLDR plural rules used in translations

# Overriding carp core libraries to use the local copy
# Remove this before release of package
# dependency_overrides:
#   carp_serializable:
#     path: ../carp/carp.sensing-flutter/carp_serializable/
# carp_themes_package:
#   path: ../carp_themes_package/

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Needed by test/example_json_test.dart, which imports the example app.
  flutter_localizations:
    sdk: flutter
  build_runner: any
  json_serializable: any
  flutter_lints: any
  test: any

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/lang/
# auto generate json code (.g files) with:
#   dart run build_runner build --delete-conflicting-outputs
