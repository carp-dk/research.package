name: research_package_demo_app
description: A demo application for Research Package
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter

  carp_themes_package: ^0.2.0
  research_package:
    path: ../

# `dependency_overrides` only apply from the root package, so the example needs
# its own copy to build against a local package. Uncomment while developing
# against an unreleased change - see the note in ../pubspec.yaml.
# TODO: remove once carp_themes_package 0.2.1 is published - the black
# divider/dialog fix this package needs is only in the local copy until then.
dependency_overrides:
  carp_themes_package:
    path: ../../carp_themes_package/
#   carp_serializable:
#     path: ../../carp/carp.sensing-flutter/carp_serializable/

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/lang/
    - assets/video/
